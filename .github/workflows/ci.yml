name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruff==0.17.1
      - run: python -m ruff check tools
      - run: python tools/check_links.py
      - run: python -B -m unittest discover -s tools -p "test_*.py"
