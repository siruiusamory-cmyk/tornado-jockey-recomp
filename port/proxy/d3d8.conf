# Tornado Jockey proxy settings, read once when the proxy loads.
# faithful=1: every port addition is off and the game behaves as it did in 2005.
# faithful=0: additions on, which is what the keyboard steering and the fixed 1/60
# step need.
# window=windowed|borderless|fullscreen-desktop and scale=1..8|fit size and place the
# window; the game still draws its 600x450 frame and the present scales it.
# step=0 keeps the original variable step (the translation comparison needs it).
faithful=0
window=windowed
scale=1
step=1
render=legacy
